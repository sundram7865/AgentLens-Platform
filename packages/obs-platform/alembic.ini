[alembic]
script_location = migrations
prepend_sys_path = src
# Timestamped, ordered filenames. Alphabetical order matching chronological
# order matters the first time you have to read the directory in a hurry.
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is intentionally absent: env.py reads it from Settings so the
# direct (non-pooled) connection string is used, and so a URL is never committed.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
